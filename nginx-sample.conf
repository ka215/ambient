error_page 403 /error.html?code=403;
error_page 404 /error.html?code=404;
error_page 500 502 503 504 /error.html?code=500;

location = /.env {
  deny all;
}

location ~ ^/\.env(?:\..*)?$ {
  deny all;
}

location ~ ^/(?:custom|functions|autoload)\.php$ {
  deny all;
}

location ~ ^/(?:config|src|logs)/ {
  deny all;
}

# Vite development reverse proxy sample
# Enable only for local development when running `npm run dev`.
# Example corresponding env:
#   ASSET_MODE=dev
#   VITE_DEV_SERVER_URL=https://dev-amp.ka2.org/vite
#
# WebSocket upgrade for Vite HMR
location /vite/ {
  proxy_pass http://127.0.0.1:5174/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection "upgrade";
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Forwarded-Host $host;
  proxy_set_header X-Forwarded-Port 443;
}

location /@vite/ {
  proxy_pass http://127.0.0.1:5174/@vite/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

location /src/ {
  proxy_pass http://127.0.0.1:5174/src/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

location /node_modules/ {
  proxy_pass http://127.0.0.1:5174/node_modules/;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
}

location / {
  try_files $uri $uri/ /index.php?$query_string;
}
